name: Check team page

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v6

      - name: Check homepage exists and is not empty
        run: test -s index.html

      - name: Report success
        run: echo "Homepage check passed!"